<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Life Simulation</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        canvas { border: 1px solid black; }
        #controls { margin: 20px; }
    </style>
</head>
<body>
    <h1>Simulation ชีวิตประดิษฐ์</h1>
    <canvas id="worldCanvas" width="500" height="500"></canvas>
    <div id="controls">
        <button onclick="startSimulation()">เริ่ม simulation</button>
        <button onclick="stopSimulation()">หยุด simulation</button>
        <p>จำนวน Agents: <span id="agentCount">0</span></p>
    </div>
    <script src="simulation.js"></script>
</body>
</html>
