<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Predator-Prey Simulation</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">
    <div id="stats">กำลังโหลดระบบ...</div>
</div>
<canvas id="world"></canvas>

<script>
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let agents = [];
let foods = [];

// --- คลาสพื้นฐาน (รวม Logic การเคลื่อนที่ลื่นไหล) ---
class BaseAgent {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.energy = 100;
        this.angle = Math.random() * Math.PI * 2;
        this.size = 5;
    }

    // เดินตรงไปข้างหน้าและสุ่มเลี้ยวทีละน้อย (แก้ปัญหาการกระตุก)
    wander(speed) {
        this.angle += (Math.random() - 0.5) * 0.2; // ค่อยๆ เลี้ยว
        this.x += Math.cos(this.angle) * speed;
        this.y += Math.sin(this.angle) * speed;
        this.keepInBounds();
    }

    // มุ่งหน้าไปหาเป้าหมาย
    steerTowards(targetX, targetY, speed) {
        let desiredAngle = Math.atan2(targetY - this.y, targetX - this.x);
        // ค่อยๆ ปรับมุม (Smoothing)
        let diff = desiredAngle - this.angle;
        this.angle += diff * 0.1; 
        
        this.x += Math.cos(this.angle) * speed;
        this.y += Math.sin(this.angle) * speed;
        this.keepInBounds();
    }

    keepInBounds() {
        if (this.x < 0 || this.x > canvas.width) this.angle = Math.PI - this.angle;
        if (this.y < 0 || this.y > canvas.height) this.angle = -this.angle;
        this.x = Math.max(0, Math.min(canvas.width, this.x));
        this.y = Math.max(0, Math.min(canvas.height, this.y));
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.color;
        // วาดเป็นรูปทรงสามเหลี่ยมเพื่อให้เห็นทิศทาง
        ctx.beginPath();
        ctx.moveTo(this.size * 1.5, 0);
        ctx.lineTo(-this.size, -this.size);
        ctx.lineTo(-this.size, this.size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// --- สายกินพืช ---
class GreenAgent extends BaseAgent {
    constructor(x, y) {
        super(x, y, '#2ecc71');
        this.speed = 2;
        this.fleeSpeed = 3.5;
    }

    update() {
        this.energy -= 0.05;
        
        // 1. ตรวจสอบศัตรู (สีแดง)
        let threat = agents.find(a => a instanceof RedAgent && Math.hypot(this.x - a.x, this.y - a.y) < 100);
        
        if (threat) {
            let escapeAngle = Math.atan2(this.y - threat.y, this.x - threat.x);
            this.angle = escapeAngle;
            this.x += Math.cos(this.angle) * this.fleeSpeed;
            this.y += Math.sin(this.angle) * this.fleeSpeed;
        } else {
            // 2. หาอาหาร
            let food = foods[0]; // ง่ายๆ คือไปหาชิ้นแรกที่เจอ
            if (food) {
                this.steerTowards(food.x, food.y, this.speed);
                if (Math.hypot(this.x - food.x, this.y - food.y) < 10) {
                    this.energy += 30;
                    foods.shift(); // กินชิ้นนั้น
                }
            } else {
                this.wander(this.speed);
            }
        }
        
        // แบ่งตัวเมื่อพลังงานเยอะ
        if (this.energy > 200) {
            this.energy = 100;
            agents.push(new GreenAgent(this.x, this.y));
        }
    }
}

// --- สายนักล่า ---
class RedAgent extends BaseAgent {
    constructor(x, y) {
        super(x, y, '#ff4d4d');
        this.speed = 2.5;
    }

    update() {
        this.energy -= 0.1;
        
        // ล่าสีเขียว
        let preyIndex = agents.findIndex(a => a instanceof GreenAgent && Math.hypot(this.x - a.x, this.y - a.y) < 200);
        
        if (preyIndex !== -1) {
            let prey = agents[preyIndex];
            this.steerTowards(prey.x, prey.y, this.speed);
            if (Math.hypot(this.x - prey.x, this.y - prey.y) < 10) {
                this.energy += 50;
                agents.splice(preyIndex, 1); // กิน!
            }
        } else {
            this.wander(this.speed);
        }

        if (this.energy > 250) {
            this.energy = 100;
            agents.push(new RedAgent(this.x, this.y));
        }
    }
}

// --- ระบบควบคุมหลัก ---
function init() {
    for(let i=0; i<15; i++) agents.push(new GreenAgent(Math.random()*canvas.width, Math.random()*canvas.height));
    for(let i=0; i<3; i++) agents.push(new RedAgent(Math.random()*canvas.width, Math.random()*canvas.height));
}

function loop() {
    // วาดพื้นหลังแบบใสเพื่อให้เห็นเส้นทาง (Motion Blur)
    ctx.fillStyle = 'rgba(26, 26, 26, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // เกิดอาหารสุ่ม
    if (Math.random() < 0.05) foods.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height});
    
    // วาดอาหาร
    ctx.fillStyle = '#f1c40f';
    foods.forEach(f => ctx.fillRect(f.x, f.y, 3, 3));

    // อัปเดตและวาด Agent
    agents = agents.filter(a => a.energy > 0);
    agents.forEach(a => {
        a.update();
        a.draw();
    });

    stats.innerText = `เขียว: ${agents.filter(a => a instanceof GreenAgent).length} | แดง: ${agents.filter(a => a instanceof RedAgent).length}`;

    requestAnimationFrame(loop);
}

init();
loop();
</script>
</body>
</html>
